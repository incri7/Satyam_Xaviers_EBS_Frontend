server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # The backend is looked up through Docker's DNS at most 10 s old, not once
    # at start-up: a deploy recreates the backend container with a new
    # address, and a cached one turned every API call into a 502 until this
    # container was restarted too. A variable in proxy_pass is what makes
    # nginx resolve it per request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    # API proxy — strips /api/ prefix before forwarding to backend container.
    # With a variable in proxy_pass nginx no longer strips the location prefix
    # itself, so the rewrite does (the query string is kept).
    location /api/ {
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket endpoint (used by real-time dashboard)
    location /ws {
        # No URI part: the request's own path (/ws…) is passed on unchanged.
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # These four are how every other asset gets invalidated, so they must never
    # be cached themselves. The regex block below matches *.js, which swept up
    # sw.js and pinned each browser to whatever build it first loaded — a new
    # deploy was invisible until the user cleared site data, because the worker
    # that would have fetched it was itself a year-old copy.
    # `location =` is an exact match and outranks the regex, whatever the order.
    location = /sw.js               { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /registerSW.js       { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /index.html          { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache, must-revalidate"; }

    # The public website (website/, its own Vite app, built to /usr/share/nginx/site): the home page,
    # its two languages and its files. Everything else is the school app, as before; its login is /login.
    # `location =` and the `^~` prefixes win over the regex blocks, so the site's .js and .png files
    # are never looked for in the app's folder.
    location = / {
        root /usr/share/nginx/site;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~ ^/(en|ne)(/|$) {
        root /usr/share/nginx/site;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ^~ /site-assets/ {
        root /usr/share/nginx/site;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # The 3D model, its lighting and the photos keep their names between builds: a day, not a year.
    location ^~ /models/ { root /usr/share/nginx/site; add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
    location ^~ /photos/ { root /usr/share/nginx/site; add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
    location ^~ /draco/  { root /usr/share/nginx/site; add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
    location = /og-image.jpg { root /usr/share/nginx/site; add_header Cache-Control "public, max-age=86400"; }

    # SPA routing — all non-file requests go to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache hashed static assets indefinitely
    location ~* \.(js|css|woff2|png|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
